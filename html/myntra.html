    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #btn{
            background: lightgreen;
            border-radius: 10px;
            padding: 5px 25px;
            margin-top: 20px;
            margin-left: 20px;
            border: none;
            height: 25px;
        }
        #wish_list{
            padding: 5px 35px;
            border: 2px solid black;
            border-radius: 10px;
            margin-left: 10px;
            text-transform: uppercase;
        }
        #one_one{
            background: lightgreen;
            border-radius: 10px;
            padding: 5px 25px;
            margin-left: 10px;
        }
        h1{
            margin-top: 10px;
            margin-left: 20px;
        }
    </style>
    <body>
        <button id="btn" onclick="cart_quantity = cart_quantity + 1; 
        document.querySelector('#cart_summery').innerHTML = `Your Bag has ${cart_quantity} items`;
        ">Add to Bag</button>
        <button id="wish_list" onclick="cart_quantity = cart_quantity - 1;
        document.querySelector('#cart_summery').innerHTML = `Your Bag has ${cart_quantity} items`;
        ">Move to Wishlist</button>
        <button id="one_one" onclick="cart_quantity = cart_quantity + 2;
        document.querySelector('#cart_summery').innerHTML = `Your Bag has ${cart_quantity} items`;
        ">Add 1+1 Sale Item</button>
        <h1 id="cart_summery"></h1>
    </body>
    <script>
        let cart_quantity = 0;
        document.querySelector('#cart_summery').innerHTML = `Your Bag has ${cart_quantity} items`;

    </script>
    </html>
