<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #ffffff;
        }
        
        /* Header Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background-color: white;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #fc8019;
            letter-spacing: -1px;
            white-space: nowrap;
        }
        
        .logo span {
            color: black;
        }
        
        .location {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #3d4152;
            cursor: pointer;
            position: relative;
            white-space: nowrap;
        }
        
        .location:hover {
            color: #fc8019;
        }
        
        .location-icon {
            color: #fc8019;
            font-size: 20px;
        }
        
        .dropdown-icon {
            font-size: 12px;
            margin-left: 5px;
            color: #3d4152;
        }
        
        .location:hover .dropdown-icon {
            color: #fc8019;
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        
        .header-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px;
            color: #3d4152;
            font-family: Gilroy, arial, Helvetica Neue, sans-serif;
            cursor: pointer;
            min-width: 50px;
            transition: all 0.2s ease;
        }
        
        .header-action:hover {
            color: #fc8019;
        }
        
        .header-action i {
            font-size: 20px;
            margin-bottom: 2px;
        }
        
        .search-box {
            display: flex;
            align-items: center;
            background-color: #f5f5f6;
            padding: 10px 15px;
            border-radius: 4px;
            margin-right: 15px;
            transition: all 0.2s ease;
        }
        
        .search-box:hover {
            background-color: #e8e8e8;
        }
        
        .search-box i {
            color: #686b78;
            margin-right: 10px;
            font-size: 16px;
        }
        
        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            width: 150px;
            font-size: 14px;
            font-weight: 500;
        }
        
        /* Main Content Styles */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .section-title {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #1a1a1a;
        }
        
        .food-categories {
            display: flex;
            gap: 30px;
            overflow-x: auto;
            padding: 15px 0 25px 0;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
        }
        
        .food-categories::-webkit-scrollbar {
            display: none;
        }
        
        .category-item {
            min-width: 120px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .category-item:hover {
            transform: scale(1.05);
        }
        
        .category-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #f5f5f6;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }
        
        .category-item:hover .category-image {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }
        
        .category-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease;
        }
        
        .category-item:hover .category-image img {
            transform: scale(1.1);
        }
        
        .category-name {
            font-size: 16px;
            color: #3d4152;
            font-weight: 600;
            white-space: nowrap;
            transition: color 0.2s ease;
        }
        
        .category-item:hover .category-name {
            color: #fc8019;
        }
        
        .divider {
            height: 1px;
            background-color: #e8e8e8;
            margin: 30px 0;
        }
        
        .restaurants-title {
            font-size: 30px;
            font-weight: 700;
            color: #1a1a1a;
        }
        
        .location-text {
            font-size: 18px;
            color: #686b78;
            margin-top: 8px;
            font-weight: 300;
        }

        /* Media Queries for Responsive Design */
        @media (max-width: 1200px) {
            .container {
                padding: 30px 40px;
            }
        }

        @media (max-width: 992px) {
            .header {
                padding: 15px 3%;
            }
            
            .header-actions {
                gap: 20px;
            }
            
            .search-box {
                display: none;
            }
            
            .header-action span {
                display: none;
            }
            
            .header-action i {
                font-size: 24px;
            }
            
            .food-categories {
                gap: 20px;
            }
            
            .category-item {
                min-width: 100px;
            }
            
            .category-image {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 768px) {
            .logo-container {
                gap: 15px;
            }
            
            .logo {
                font-size: 24px;
            }
            
            .location {
                font-size: 14px;
            }
            
            .header-actions {
                gap: 15px;
            }
            
            .header-action i {
                font-size: 20px;
            }
            
            .section-title, .restaurants-title {
                font-size: 24px;
            }
            
            .location-text {
                font-size: 16px;
            }
            
            .food-categories {
                gap: 15px;
            }
            
            .category-item {
                min-width: 90px;
            }
            
            .category-image {
                width: 90px;
                height: 90px;
            }
            
            .category-name {
                font-size: 14px;
            }
        }

        @media (max-width: 576px) {
            .header {
                padding: 12px 15px;
                flex-wrap: nowrap;
            }
            
            .logo-container {
                gap: 10px;
                min-width: 0;
                flex-shrink: 1;
                overflow: hidden;
            }
            
            .logo {
                font-size: 22px;
                flex-shrink: 0;
            }
            
            .location {
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                flex-shrink: 1;
                min-width: 0;
            }
            
            .location-icon {
                font-size: 16px;
                flex-shrink: 0;
            }
            
            .header-actions {
                gap: 12px;
                flex-shrink: 0;
            }
            
            .header-action i {
                font-size: 18px;
            }
            
            .container {
                padding: 20px 15px;
            }
            
            .section-title, .restaurants-title {
                font-size: 20px;
                margin-bottom: 15px;
            }
            
            .location-text {
                font-size: 14px;
            }
            
            .food-categories {
                gap: 10px;
                padding: 10px 0 20px 0;
            }
            
            .category-item {
                min-width: 80px;
            }
            
            .category-image {
                width: 80px;
                height: 80px;
                margin-bottom: 10px;
            }
            
            .category-name {
                font-size: 12px;
            }
            
            .divider {
                margin: 20px 0;
            }
        }

        @media (max-width: 400px) {
            .logo {
                font-size: 20px;
            }
            
            .location {
                font-size: 11px;
                max-width: 80px;
            }
            
            .header-actions {
                gap: 10px;
            }
            
            .header-action i {
                font-size: 16px;
            }
            
            .category-item {
                min-width: 70px;
            }
            
            .category-image {
                width: 70px;
                height: 70px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <div class="logo">G<span>omer</span></div>
            <div class="location">
                <span class="location-icon"><i class="fas fa-map-marker-alt"></i></span>
                <span>Other</span>
                <i class="fas fa-chevron-down dropdown-icon"></i>
            </div>
        </div>
        
        <div class="header-actions">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search">
            </div>
            <div class="header-action">
                <i class="far fa-copyright"></i>
                <span>Swiggy Corporate</span>
            </div>
            <div class="header-action">
                <i class="fas fa-search"></i>
                <span>Search</span>
            </div>
            <div class="header-action">
                <i class="far fa-registered"></i>
                <span>Offers</span>
            </div>
            <div class="header-action">
                <i class="far fa-question-circle"></i>
                <span>Help</span>
            </div>
            <div class="header-action">
                <i class="far fa-user"></i>
                <span>Sign In</span>
            </div>
            <div class="header-action">
                <i class="fas fa-shopping-cart"></i>
                <span>Cart</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="section">
            <h1 class="section-title">What's on your mind?</h1>
            
            <div class="food-categories">
                <div class="category-item">
                    <div class="category-image">
                        <img src="https://b.zmtcdn.com/data/dish_images/d19a31d42d5913ff129cafd7cec772f81639737697.png" alt="Biryani">
                    </div>
                    <div class="category-name">Biryani</div>
                </div>
                
                <div class="category-item">
                    <div class="category-image">
                        <img src="https://b.zmtcdn.com/data/dish_images/d5ab931c8c239271de45e1c159af94311634805744.png" alt="Cakes">
                    </div>
                    <div class="category-name">Cakes</div>
                </div>
                
                <div class="category-item">
                    <div class="category-image">
                        <img src="https://b.zmtcdn.com/data/o2_assets/d0bd7c9405ac87f6aa65e31fe55800941632716575.png" alt="Pizzas">
                    </div>
                    <div class="category-name">Pizzas</div>
                </div>
                
                <div class="category-item">
                    <div class="category-image">
                        <img src="https://www.cookwithmanali.com/wp-content/uploads/2020/05/Masala-Dosa.jpg" alt="Dosa">
                    </div>
                    <div class="category-name">Dosa</div>
                </div>
                
                <div class="category-item">
                    <div class="category-image">
                        <img src="https://b.zmtcdn.com/data/dish_images/91c554bcbbab049353a8808fc970e3b31615960315.png" alt="Noodles">
                    </div>
                    <div class="category-name">Noodles</div>
                </div>
                
                <div class="category-item">
                    <div class="category-image">
                        <img src="https://b.zmtcdn.com/data/o2_assets/4bf016f32f05d26242abc690e30e9d4f1c1b20113.png" alt="Ice-Cream">
                    </div>
                    <div class="category-name">Ice-Cream</div>
                </div>
                
                <div class="category-item">
                    <div class="category-image">
                        <img src="https://b.zmtcdn.com/data/o2_assets/e444ade83eb22360b6ca79e6e777955f1632716661.png" alt="Chinese">
                    </div>
                    <div class="category-name">Chinese</div>
                </div>
            </div>
        </div>
        
        <div class="divider"></div>
        
        <div>
            <h1 class="restaurants-title">Top restaurant chains in Chhindwara</h1>
            <p class="location-text">Chhindwara</p>
        </div>
    </div>
</body>
</html>
