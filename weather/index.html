<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      /* background: url('https://images.unsplash.com/photo-1501973801540-537f08ccae7b') no-repeat center center/cover; */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
    }

    .card {
      background: linear-gradient(135deg, rgba(146, 255, 224, 0.9), rgba(60, 59, 146, 0.9));
      color: white;
      border-radius: 20px;
      padding: 30px 20px;
      width: 340px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .logo img {
      width: 40px;
      height: 40px;
    }

    .logo h1 {
      font-size: 22px;
      font-weight: 600;
    }

    .search {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 5px 10px;
      margin-bottom: 25px;
    }

    .search input {
      flex: 1;
      border: none;
      background: transparent;
      color: white;
      padding: 10px;
      font-size: 14px;
      outline: none;
    }

    .search button {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 5px;
    }

    .search img {
      width: 20px;
      height: 20px;
      filter: invert(1);
    }

    .img {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-bottom: 10px;
      animation: fadeIn 1s ease-in;
    }

    .weathericon {
      width: 60px;
      height: 60px;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    .temp {
      font-size: 32px;
      font-weight: bold;
    }

    .weather-info {
      font-size: 14px;
      margin-top: 5px;
      color: #eee;
    }

    .city {
      font-size: 18px;
      margin: 10px 0;
      font-weight: 500;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }

    .city img {
      width: 16px;
      height: 16px;
      filter: invert(1);
    }

    .updated-time {
      font-size: 12px;
      margin-top: 5px;
      opacity: 0.7;
    }

    .other-info {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
    }

    .humidity,
    .wind {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .humidity img,
    .wind img {
      width: 25px;
      height: 25px;
      margin-bottom: 5px;
      filter: invert(1);
    }

    .humidity-value,
    .speed-value {
      font-size: 14px;
      font-weight: 500;
    }

    .options {
      margin-top: 15px;
      padding: 8px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      cursor: pointer;
      outline: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media screen and (max-width: 400px) {
      .card {
        width: 90%;
        padding: 25px 15px;
      }

      .logo h1 {
        font-size: 18px;
      }

      .temp {
        font-size: 28px;
      }

      .search input {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" alt="app-logo" />
      <h1>WeatherNow</h1>
    </div>

    <div class="search">
      <input type="text" id="cityInput" placeholder="Enter the city." />
      <button type="submit" id="searchBtn">
        <img src="https://cdn-icons-png.flaticon.com/512/751/751463.png" alt="searchIcon" />
      </button>
    </div>

    <div class="img">
      <img src="https://cdn-icons-png.flaticon.com/512/869/869869.png" class="weathericon" alt="weather-icon" />
      <div>
        <h1 class="temp" id="temperature">38°C</h1>
        <p class="weather-info">Feels like 35°C</p>
      </div>
    </div>

    <p id="description">Clear Sky</p>
    <h2 class="city">
      <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png" alt="pin" />
      <h2 id="location"></h2>

    </h2>
    <p id="lastUpdated"></p>


    <div class="other-info">
      <div class="humidity">
        <img src="https://cdn-icons-png.flaticon.com/512/728/728093.png" alt="humidity" />
        <div>
          <h4 class="humidity-value" id="humidity">15%</h4>
          <p>Humidity</p>
        </div>
      </div>
      <div class="wind">
        <img src="https://cdn-icons-png.flaticon.com/512/4150/4150897.png" alt="wind" />
        <div>
          <h4 class="speed-value" id="windSpeed">7.43 km/h</h4>
          <p>Wind Speed</p>
        </div>
      </div>
    </div>

    <select class="options">
      <option value="Celsius">Celsius</option>
      <option value="Fahrenheit">Fahrenheit</option>
    </select>
  </div>
</body>
<!-- <script src="weather_data.js"></script> -->
 <script>
  document.getElementById("searchBtn").addEventListener("click", getWeather);
document.getElementById("cityInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") getWeather();
});

function getWeather(){
    const city = document.getElementById("cityInput").value.trim();
    if(!city){
        alert("Please enter city name.");
        return;
    }
    fetchWeatherdata(city);
}

const apiKey = "6510c77e8295763d92eabab09e9d3393";

function fetchWeatherdata(city) {
    const apiurl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}`;

    fetch(apiurl)
    .then(response => {
        if(!response.ok){
            return response.json().then(err =>{
                throw new Error("City not found");
            });
        }
        return response.json();
    })
    .then(data => displayWeather(data))
    .catch(error => showError(error.message));
}
function displayWeather(data){
    let celsiusTemp = data.main.temp - 273.15;
    document.getElementById("temperature").innerText = `${celsiusTemp.toFixed(2)}°C`;
    document.getElementById("humidity").innerText = `${data.main.humidity}%`;
    document.getElementById("windSpeed").innerText = `${data.wind.speed} km/h`;
    document.getElementById("location").innerText = `${data.name}, ${data.sys.country}`;
    const now = new Date();
    document.getElementById("lastUpdated").innerText = `Last updated: ${now.toLocaleTimeString()}`;
}

function showError(msg) {
    alert("Error: " + msg);
}

 </script>
</html>
