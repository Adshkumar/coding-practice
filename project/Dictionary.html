<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #0f4c5c;
      color: white;
    }
    .cards {
      width: 90%;
      max-width: 34.37em;
      max-height: 90vh;
      background-color: #ffffff;
      position: absolute;
      transform: translate(-50%, -50%);
      top: 50%;
      left: 50%;
      padding: 3em;
      border-radius: 1em;
      box-shadow: 0 4em 5em rgba(27, 8, 53, 0.2);
    }
    #words {
      width: 100%;
      max-width: 400px;
      padding: 10px 15px;
      font-size: 16px;
      outline: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    #words:focus {
      border-color: #6414e9;
      box-shadow: 0 0 8px rgba(100, 20, 233, 0.5);
    }
    .container {
      display: flex;
      align-items: center;
      margin-bottom: 2em;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }
    #words {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      padding: 8px;
    }

    #Search-btn {
      background-color: #6414e9;
      color: white;
      padding: 8px 15px;
      margin-left: 10px;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
      font-weight: bold;
    }
    .meaning {
      color: black;
      margin-top: 50px;
      font-size: 27px;
      margin-bottom: 15px;
    }
    #meanings {
      color: black;
      margin-top: 50px;
      font-size: 18px;
      margin-bottom: 15px;
    }
    #speaker {
      color: #6414e9;
      display: flex;
      justify-content: flex-end;
      margin-right: 50px;
      margin-top: -45px;
    }
    .examples {
      margin-bottom: 15px;
      color: black;
      margin-top: 30px;
      border-left: 4px solid #6414e9;
      padding-left: 12px;
      font-style: italic;
    }
    .details {
      color: black;
      font-size: 1rem;
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
  <body>
    <div class="cards">
      <div class="container">
        <input type="text" id="words" placeholder="Type the words here..." />
        <div id="Search-btn">Search</div>
      </div>
      <h1 class="meaning">Sample</h1>
      <span class="details">noun /baɪ/</span>
      <div id="speaker">
        <i class="fa-solid fa-volume-up"></i>
      </div>
      <div id="meanings">
        <strong>Meaning:</strong> A small portion or example.
      </div>
      <div class="examples">
        <strong>Example:</strong> "This is just a sample of our products."
      </div>
    </div>
  </body>
  <script>
    const url = "https://api.dictionaryapi.dev/api/v2/entries/en/";

    document.getElementById("words").addEventListener("keypress", function(e){
      if(e.key === "Enter"){
        document.getElementById("Search-btn").click();
      }
    })
    const btn = document.getElementById("Search-btn");
    const meanings = document.getElementById("meanings");
    const wordHeading = document.querySelector(".meaning");
    const details = document.querySelector(".details");
    const examples = document.querySelector(".examples");
    const speaker = document.getElementById("speaker");

    btn.addEventListener("click", () => {
      let words = document.getElementById("words").value;

      if (!words) {
        alert("Please enter a word!");
        return;
      }

      fetch(`${url}${words}`)
        .then((Response) => Response.json())
        .then((data) => {
          console.log(data);

          const entry = data[0];
          const word = entry.word;
          const phonetics = entry.phonetics.find((p) => p.text)?.text || "";
          const audio = entry.phonetics.find((p) => p.audio)?.audio || "";
          const partOfSpeech = entry.meanings[0].partOfSpeech;
          const definition = entry.meanings[0].definitions[0].definition;
          const example =
            entry.meanings[0].definitions[0].example || "No example available.";
          wordHeading.textContent = word;
          details.textContent = `${partOfSpeech} ${phonetics}`;
          meanings.innerHTML = `<strong>Meaning:</strong> ${definition}`;
          examples.innerHTML = `<strong>Example:</strong> "${example}"`;

          speaker.onclick = () => {
            if (audio) {
              let sound = new Audio(audio);
              sound.play();
            } else {
              alert("No audio available for this word.");
            }
          };
        })
        .catch((error) => {
          console.error(error);
          meanings.innerHTML = `<strong>Meaning:</strong> Not found.`;
          examples.innerHTML = "";
          wordHeading.textContent = "Not Found";
          details.textContent = "";
        });
    });
  </script>
</html>
